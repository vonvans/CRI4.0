# Arkime config for the CRI4.0 traffic-analysis stack.
#
# This file is shared by the viewer and by every per-machine capture process.
# The viewer reads `elasticsearch` from here (it runs with host networking, so
# localhost:9200 reaches the OpenSearch container). Each capture process runs
# inside a Kathara container's network namespace and overrides `elasticsearch`
# on the command line to reach the host via the docker0 gateway.
[default]
elasticsearch=http://localhost:9200
# "any" captures every interface of the machine the capture is attached to
# (management + all lab collision domains), so inter-machine lab traffic that
# is invisible on the host is recorded from inside each netns.
interface=any
pcapDir=/opt/arkime/raw
# 64K tolerates GRO/GSO-coalesced packets (avoids "requires full packet captures").
snapLen=65536
# libpcap works on the "any" pseudo-interface (tpacketv3 does not).
pcapReadMethod=libpcap
# Uncompressed pcap so packets hit disk immediately and the tcpflow view works
# even for small flows (zstd buffers until a whole block accumulates).
simpleCompression=none
packetThreads=1
# No login: the viewer is embedded in CRI4.0 modals/iframes.
authMode=anonymous
viewPort=8005
viewHost=0.0.0.0
# Serve the viewer under /arkime/ so the CRI4.0 app can reverse-proxy it on its
# own origin. Same-origin embedding keeps Arkime's SameSite=Strict auth cookie
# first-party (otherwise the iframe fails with "Missing token"); the proxy also
# strips X-Frame-Options. See the /arkime routes in the dev-server config.
webBasePath=/arkime/
# Small rotation: labs are short-lived.
maxFileSizeG=1
freeSpaceG=1
