<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRI 4.0 - System view</title>
    <style>
        body {
            margin: 0;
            background: #9a9a9a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            width: 100vW;
            height: 200vH;
            overflow: hidden;
        }
        #canvas-container {
            flex-grow: 1;
            height: 100vh; 
            background: #aaaaaa;
            position: relative; 
            z-index: 1;
        }
        #info {
            width: 320px;
            min-width: 320px; 
            height: 100vh; 
            background: #222; 
            padding: 20px; 
            box-sizing: border-box; 
            overflow-y: auto;
            border-right: 2px solid #333; 
            z-index: 10;
        }
        #view-selector {
            margin-top: 15px; 
            width: 100%; 
            padding: 8px; 
            background: #333; 
            color: #fff; 
            border: 1px solid #555; 
            border-radius: 3px; 
            cursor: pointer;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "/libs/three.module.min.js",
        "three/addons/loaders/GLTFLoader.js": "/libs/addons/loaders/GLTFLoader.js"
      }
    }
    </script>
</head>
<body>
    <div id="info">
        <h3>Simulation state</h3>
        <div id="telemetry-panel">Waiting for data...</div>
        
        <select id="view-selector">
            <option value="2d">Vista 2D (Canvas)</option>
            <option value="3d">Vista 3D (Three.js)</option>
        </select>
    </div>
    
    <div id="canvas-container"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
